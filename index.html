<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16110d">
  <title>D4 Spickzettel</title>
  <meta name="app-version" content="7">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <!-- Versionsnummer bei jedem Release erhöhen (auch in style.css?v= und den Skripten): erzwingt neue Dateien statt Browser-Cache -->
  <header class="top">
    <div class="brand-row">
      <div class="brand">D4 Spickzettel</div>
      <div class="wissen-meta" id="wissen-meta"></div>
      <button class="btn-dateien" id="btn-dateien" aria-label="Dateien und Einstellungen">⚙ Dateien</button>
    </div>
    <div class="build-info" id="build-info"></div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="suche">Suche</button>
    <button data-tab="builds">Builds</button>
    <button data-tab="inventar">Inventar</button>
    <button data-tab="pruefen">Item prüfen</button>
    <button data-tab="naechster">Nächster Schritt</button>
    <button data-tab="fehlt">Was fehlt</button>
    <button data-tab="bestand">Bestand</button>
    <button data-tab="checkliste">Checkliste</button>
    <button data-tab="rezepte">Rezepte</button>
    <button data-tab="farmziele">Farmziele</button>
    <button data-tab="wissen">Wissen</button>
    <button data-tab="abweichungen">Abweichungen</button>
  </nav>
  <div id="banner"></div>
  <main id="main"></main>
  <script src="lib.js?v=7"></script>
  <script src="app.js?v=7"></script>
  <script src="inventar.js?v=7"></script>
  <script src="fehlt.js?v=7"></script>
</body>
</html>
